# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# Drafts changelog entries from the conventional commits: `git cliff --unreleased`.
# CHANGELOG.md is written by hand: edit the draft into its Unreleased section. cargo-release
# dates that section at release time, so the curated notes are kept.

[changelog]
header = """
# Changelog

All notable changes to the partyline crates are documented in this file.
The four crates share one version, so one entry covers all of them.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="partyline-") | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %}: {{ commit.breaking_description }}{% endif %}\
{% endfor %}
{% endfor %}

"""
footer = """
{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="partyline-") | trim_start_matches(pat="v") }}]: https://github.com/sagikazarmark/partyline/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version | trim_start_matches(pat="partyline-") | trim_start_matches(pat="v") }}]: https://github.com/sagikazarmark/partyline/releases/tag/{{ release.version }}
{% endif -%}
{% else -%}
[Unreleased]: https://github.com/sagikazarmark/partyline/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
# Releases are tagged v{version}. 0.1.0 predates the shared version and was tagged per
# crate: partyline-v0.1.0 stands for all four.
tag_pattern = "^(partyline-)?v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
  # The first commit predates conventional commits.
  { pattern = "^initial commit", replace = "feat: initial release" },
  # Drop a pull request reference from the end of the subject: "(#12)".
  { pattern = '\s*\(#[0-9]+\)$', replace = "" },
]
commit_parsers = [
  { message = "^chore: [Rr]elease", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^revert", group = "<!-- 4 -->Reverted" },
  { message = "^docs?", group = "<!-- 5 -->Documentation" },
  { body = ".*security", group = "<!-- 6 -->Security" },
  { message = "^(build|ci|chore|style|test)", skip = true },
]
