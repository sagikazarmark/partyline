[workspace]
resolver = "3"
members = [
    "crates/partyline",
    "crates/partyline-client",
    "crates/partyline-dioxus",
    "crates/partyline-worker",
    "examples/chat/shared",
    "examples/chat/worker",
    "examples/chat/web",
    "examples/orders/shared",
    "examples/orders/worker",
    "examples/orders/web",
    "examples/orders/tail",
    "examples/poll/shared",
    "examples/poll/worker",
    "examples/poll/web",
    "e2e",
    "e2e/fixture",
]
default-members = [
    "crates/partyline",
    "crates/partyline-client",
    "crates/partyline-dioxus",
    "crates/partyline-worker",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/partyline"
keywords = ["websocket", "durable-objects", "dioxus", "realtime", "cloudflare"]
categories = ["web-programming::websocket", "wasm"]

[workspace.dependencies]
partyline = { version = "0.2.0", path = "crates/partyline" }
partyline-client = { version = "0.2.0", path = "crates/partyline-client" }
partyline-dioxus = { version = "0.2.0", path = "crates/partyline-dioxus" }
partyline-worker = { version = "0.2.0", path = "crates/partyline-worker" }

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"

futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
futures-timer = "3.0.3"
gloo-net = { version = "0.6", default-features = false, features = ["websocket"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
tokio = { version = "1", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false }
rustls = { version = "0.23", default-features = false }

dioxus = { version = "0.7.10", default-features = false }
worker = "0.8.7"

proptest = "1.11"
wasm-bindgen-test = "0.3"

# cargo-release: bumps the shared version, commits, tags, publishes to crates.io, and pushes.
[workspace.metadata.release]
allow-branch = ["main"]
sign-commit = true
sign-tag = true
shared-version = true
consolidate-commits = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
