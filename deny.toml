[graph]
all-features = true

[licenses]
allow = [
  "Apache-2.0",
  "MIT",

  "Unicode-3.0",
  "BSD-3-Clause",
  "ISC",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
  # chrono is unmaintained, but has no known vulnerability. worker 0.9, its latest release,
  # requires it. Remove this entry when worker drops chrono.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, no vulnerability; required by worker 0.9" },
]
