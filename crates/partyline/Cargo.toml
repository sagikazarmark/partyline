[package]
name = "partyline"
version.workspace = true
description = "Sequenced, resumable server-to-client events: protocol types, sans-IO client state machine, and replay rules"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

# The release turns the hand-written Unreleased section of the workspace changelog into the
# new version's section. It lives in one crate, because the four crates release together.
[package.metadata.release]
pre-release-replacements = [
    { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
    { file = "../../CHANGELOG.md", search = "\\[Unreleased\\]: (.*)/compare/(.*)\\.\\.\\.HEAD", replace = "[Unreleased]: $1/compare/{{tag_name}}...HEAD\n[{{version}}]: $1/compare/$2...{{tag_name}}", exactly = 1 },
]
