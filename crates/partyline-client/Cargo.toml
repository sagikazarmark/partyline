[package]
name = "partyline-client"
version.workspace = true
description = "partyline client: WebSocket transports and a runtime-agnostic driver for web (wasm) and native"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
## Listens for `visibilitychange`, `online`, `pageshow` (back-forward cache restore), `resume`
## (after a freeze), and network changes in the browser, and wakes the client.
web-wake = [
    "web-sys/Window",
    "web-sys/Document",
    "web-sys/VisibilityState",
    "web-sys/EventTarget",
    "web-sys/Event",
    "web-sys/Navigator",
    "web-sys/PageTransitionEvent",
]
## Logs every driver input and output at `trace`, and transport errors at `debug`.
tracing = ["dep:tracing"]

[dependencies]
partyline.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing = { version = "0.1.41", default-features = false, features = ["std"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-timer.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { workspace = true, features = ["wasm-bindgen"] }
gloo-net.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Location", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
serde.workspace = true
gloo-net = { workspace = true, features = ["http"] }
serde_json.workspace = true
web-sys = { workspace = true, features = ["RequestMode"] }
wasm-bindgen-futures.workspace = true
wasm-bindgen-test.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
