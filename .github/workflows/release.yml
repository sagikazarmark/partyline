name: Release

# cargo-release pushes a signed v{version} tag. This workflow publishes the crates from it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write # crates.io trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Check that the tag matches the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "partyline") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the workspace version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Dependencies first. `cargo publish` waits until each crate is in the index.
      # A crate already on crates.io at this version is skipped, so a failed run can be re-run.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in partyline partyline-client partyline-worker partyline-dioxus; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "partyline-release (github.com/sagikazarmark/partyline)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$status" = 200 ]; then
              echo "$crate $VERSION is already published"
              continue
            fi
            cargo publish --locked -p "$crate"
          done

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish

    permissions:
      contents: write # create the release

    steps:
      # GitHub generates the release notes from the pull requests merged since the last tag.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
