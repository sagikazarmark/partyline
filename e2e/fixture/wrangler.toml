name = "partyline-e2e-fixture"
main = "build/index.js"
compatibility_date = "2026-09-01"

# [build]
# command = "worker-build --release"

[[durable_objects.bindings]]
name = "TICK_CHANNEL"
class_name = "TickChannel"

[[durable_objects.bindings]]
name = "LEGACY_CHANNEL"
class_name = "LegacyChannel"

[[durable_objects.bindings]]
name = "ROOM_CHANNEL"
class_name = "RoomChannel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TickChannel"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LegacyChannel"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RoomChannel"]
