[package]
name = "partyline-e2e"
version = "0.0.0"
description = "End-to-end tests against the examples and the fixture under wrangler dev"
edition.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
chat-shared = { path = "../examples/chat/shared" }
futures.workspace = true
orders-shared = { path = "../examples/orders/shared" }
partyline.workspace = true
partyline-client.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
